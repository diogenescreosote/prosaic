# SCENARIO FIXTURE — fictional test matter shipped with prosaic.
# All parties, case numbers, and facts are invented (Smith v. Roe,
# 24CV00000). Exhibit binaries are generated at test setup.
envelopes:
  motion_packet:
    sources:
      - Declaration of Jane Roe.md
      - file: Proposed Order.md
        docx: true
      - Memo of Points.md
    copies:
      - src: assets/static_notice.pdf
