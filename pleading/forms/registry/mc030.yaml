# MC-030 — Declaration (Judicial Council of California)
#
# The reference descriptor: read this one first when learning the
# format. Field names ("FillText35" etc.) are the blank's real AcroForm
# identifiers, determined empirically by filling each field with its
# own name and rendering — MC-030's field names carry no meaning.

form: mc030
title: Declaration
domain: ca/general            # usable in any CA case type
revision: "2006-01"           # form face: "MC-030 [Rev. January 1, 2006]"
source_url: https://courts.ca.gov/documents/mc030.pdf
blank: mc030.pdf
technology: overlay           # draw at each widget's rect and flatten (ADR-0046)
# E-sign roles (ADR-0033): the declarant signs page 1.
esign_parties: [filer]

# Interactive-use chrome stripped from filing copies: privacy banners
# and Save/Print/Clear buttons.
chrome_fields: [WhiteOut, NoticeHeader1, NoticeFooter1, Save, Print, ResetForm]

fields:
  attorney_line1:
    map: FillText35
    align: left
    page: 1
    doc: "Attorney/party block line 1 — name (and SBN)"
    auto: attorney_line1
  attorney_line2:
    map: FillText34
    align: left
    page: 1
    doc: "Attorney/party block line 2 — firm or street address"
    auto: attorney_line2
  attorney_line3:
    map: FillText32
    align: left
    page: 1
    doc: "Attorney/party block line 3"
    auto: attorney_line3
  attorney_line4:
    map: FillText37
    align: left
    page: 1
    doc: "Attorney/party block line 4"
    auto: attorney_line4
  phone:
    map: FillText31
    page: 1
    doc: "Telephone no."
    auto: phone
  fax:
    map: FillText30
    page: 1
    doc: "Fax no. (optional)"
    auto: fax
  email:
    map: FillText36
    page: 1
    doc: "Email address"
    auto: email
  attorney_for:
    map: FillText29
    page: 1
    doc: "ATTORNEY FOR (Name) — or the filer's own role if self-represented"
    auto: attorney_for
  court_county:
    map: FillText27
    page: 1
    doc: "County name only — the form prints 'SUPERIOR COURT OF CALIFORNIA, COUNTY OF'"
    auto: court_county
  court_street_address:
    map: FillText26
    page: 1
    auto: court_street_address
    doc: "Court street address"
  court_mailing_address:
    map: FillText25
    page: 1
    auto: court_mailing_address
    doc: "Court mailing address"
  court_city_zip:
    map: FillText24
    page: 1
    auto: court_city_zip
    doc: "Court city and ZIP"
  court_branch:
    map: FillText23
    page: 1
    auto: court_branch
    doc: "Court branch name"
  plaintiff:
    map: FillText22
    page: 1
    doc: "PLAINTIFF/PETITIONER caption name"
    auto: petitioner
  defendant:
    map: FillText21
    page: 1
    doc: "DEFENDANT/RESPONDENT caption name"
    auto: respondent
  case_number:
    map: FillText15
    align: center
    page: 1
    auto: case_number
    doc: "Case number"
  body:
    map: FillText19
    align: left
    valign: top
    page: 1
    doc: >-
      The declaration body. Practice commonly puts
      "See attached Declaration of <name>." here (the default) and
      attaches the full declaration; long text spills to an MC-025
      automatically.
    auto: see_attached_declaration
    fit: overflow_attachment
    attachment_label: Attachment 1
  date:
    map: FillText20
    page: 1
    doc: "Date — LEAVE BLANK for hand-dating at signature"
    esign: {type: date, party: filer}
  signature:
    page: 1
    # Hand-authored rect (no widget): the declarant's signature rule on
    # page 1 runs x 324–569 at 679 pt from the top (113 pt from the
    # bottom); the box rests on it and rises 28 pt.
    rect: [326, 113, 568, 141]
    doc: "The declarant's signature line — never machine-filled."
    default: ""
    esign: {type: signature, party: filer}
    default: ""
  print_name:
    map: FillText18
    page: 1
    doc: "Type or print declarant's name"
    auto: declarant_name
  other_role_specify:
    map: FillText1885
    align: center
    page: 1
    doc: "'Other (Specify):' next to the role checkboxes — usually blank"
    default: ""

checkboxes:
  # Hand-authored rects, not `map:` --- the blank's AcroForm gives every
  # one of these six widgets the SAME qualified name ("CheckBox 2" /
  # "CheckBx 2"), so a name lookup can only ever reach the first.
  role_attorney:
    page: 1
    rect: [315.70258, 83.73532, 328.09927, 93.65268]
    doc: "'Attorney for' role checkbox"
  role_plaintiff:
    page: 1
    rect: [390.90921, 83.73532, 403.30591, 93.65268]
    doc: "'Plaintiff' role checkbox"
  role_petitioner:
    page: 1
    rect: [447.10757, 83.73532, 459.50427, 93.65268]
    doc: "'Petitioner' role checkbox"
  role_defendant:
    page: 1
    rect: [515.70264, 83.73532, 528.09933, 93.65268]
    doc: "'Defendant' role checkbox"
  role_respondent:
    page: 1
    rect: [315.70258, 68.85928, 328.09927, 78.77664]
    doc: "'Respondent' role checkbox"
  role_other:
    page: 1
    rect: [390.90921, 68.03284, 403.30591, 78.77664]
    doc: "'Other (Specify):' role checkbox"

# Left entirely blank (the historic default), the declarant checks the
# right one by hand at signing time, like the date and signature --
# that stays valid. But once a source starts setting any box in this
# row (the third-party-declarant case: the declarant is not a party or
# attorney in this case, so their role is knowable and worth filling in
# at drafting time rather than leaving for hand-completion), exactly
# one of Plaintiff/Petitioner/Defendant/Respondent/Other must be
# checked -- role_attorney is independent (a party's own attorney can
# also be, e.g., the Respondent) -- and Other requires
# other_role_specify to say what the role is.
checkbox_groups:
  - boxes: [role_plaintiff, role_petitioner, role_defendant, role_respondent, role_other]
    require: exactly_one
    text_required_when:
      role_other: other_role_specify

agent_guide: |
  MC-030 is the general-purpose declaration cover form. prosaic's
  usual pattern: set `cover_sheet: mc030` in a declaration source's
  front matter and the build prepends this form with
  "See attached Declaration of <declarant>." in the body.

  To fill it directly, provide the standard caption front matter
  (filer_*, court_*, petitioner, respondent, case_number) — every
  caption field resolves automatically — plus optionally:

      forms:
        mc030:
          body: "Custom body text instead of 'See attached…'"
          print_name: "Declarant Name"     # else parsed from paper_title

  Date and signature are ALWAYS left blank for the human to complete
  at signing. Do not fill them.

  The role checkbox (Attorney for/Plaintiff/Petitioner/Defendant/
  Respondent/Other) is usually ALSO left blank for hand-completion at
  signing, when the declarant is a party or their attorney and their
  own role could plausibly be checked either way. For a third-party
  declarant whose role is fixed and knowable at drafting time (an
  expert, a treating provider, a witness), set it explicitly instead:

      forms:
        mc030:
          role_other: true
          other_role_specify: "Family Therapist"

  The build enforces exactly one of Plaintiff/Petitioner/Defendant/
  Respondent/Other once any of them is set, and requires
  other_role_specify whenever role_other is checked; role_attorney is
  independent of that group (a party's own attorney may also be, say,
  the Respondent).
