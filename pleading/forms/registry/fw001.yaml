    doc: "Item 10.d: real estate address"
    default: ""
  real_estate_value_1:
    map: "FW-001[0].Page2[0].List10[0].Lid[0].RealEstateFairMarketVal1[0]"
    page: 2
    default: ""
  real_estate_owed_1:
    map: "FW-001[0].Page2[0].List10[0].Lid[0].RealEstateAmountOwed1[0]"
    page: 2
    default: ""
  other_property_1:
    map: "FW-001[0].Page2[0].List10[0].Lie[0].OtherPropertyDesc1[0]"
    page: 2
    doc: "Item 10.e: other property of value"
    default: ""
  other_property_value_1:
    map: "FW-001[0].Page2[0].List10[0].Lie[0].OtherPropertyFairMarketVal1[0]"
    page: 2
    default: ""
  other_property_owed_1:
