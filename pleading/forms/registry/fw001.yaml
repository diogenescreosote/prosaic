    page: 1
    auto: short_title
    fit: shrink_wrap
    doc: >-
      Case name, e.g. 'Roe v. Doe'. shrink_wrap because a realistic long
      caption overflows this narrow box even at shrink's minimum size
      (caught by the adversarial caption test).

  # ---- item 1: who is asking ------------------------------------------
  applicant_name:
    map: "FW-001[0].Page1[0].List1[0].item1[0].PetitionerName1[0]"
    page: 1
    auto: filer_name_bare
    doc: "Item 1: your name"
  applicant_street:
    map: "FW-001[0].Page1[0].List1[0].item1[0].PetitionerStrAddress[0]"
    page: 1
    auto: filer_street
    doc: "Item 1: street address"
  applicant_city:
    map: "FW-001[0].Page1[0].List1[0].item1[0].PetitionerCity[0]"
    page: 1
    auto: filer_city
  applicant_state:
    map: "FW-001[0].Page1[0].List1[0].item1[0].PetitionerState[0]"
    page: 1
    auto: filer_state
  applicant_zip:
    map: "FW-001[0].Page1[0].List1[0].item1[0].PetitionerZip[0]"
    page: 1
    auto: filer_zip
  applicant_phone:
    map: "FW-001[0].Page1[0].List1[0].item1[0].PetitionerTel[0]"
    page: 1
    auto: phone

  # ---- item 2: your job -----------------------------------------------
  job_title:
    map: "FW-001[0].Page1[0].List2[0].item2[0].PetitionerJobTitle[0]"
    page: 1
    doc: >-
      Item 2: job title. Write the truth for an unemployed applicant ---
      'Unemployed since <date>' --- rather than leaving it blank, which
      reads as an omission.
    default: ""
  employer_name:
    map: "FW-001[0].Page1[0].List2[0].item2[0].PetitionerEmployerName[0]"
    page: 1
    doc: "Item 2: employer's name"
    default: ""
  employer_address:
    map: "FW-001[0].Page1[0].List2[0].item2[0].PetitionerEmployerAdd[0]"
    page: 1
    doc: "Item 2: employer's address"
    default: ""

  # ---- item 3: lawyer, if any -----------------------------------------
  lawyer_info:
    map: "FW-001[0].Page1[0].List3[0].PetitionerLawyerInfo[0]"
    page: 1
    doc: "Item 3: your lawyer's name, firm and address. Blank if self-represented."
    default: ""
  lawyer_sig:
    map: "FW-001[0].Page1[0].List3[0].Lib[0].PetLawyerSigLine[0]"
    page: 1
    doc: "Item 3.b: the lawyer signs. ALWAYS BLANK here."
    default: ""

  # ---- item 6: previous waiver in this case ---------------------------
  # (checkboxes only; the attachment goes on MC-025)

  # ---- signature block ------------------------------------------------
  sig_date:
    map: "FW-001[0].Page1[0].Sign[0].SigDate[0]"
    page: 1
    doc: "Date beside the signature. LEAVE BLANK for signing time."
    default: ""
  print_name:
    map: "FW-001[0].Page1[0].Sign[0].PetitionerName[0]"
    page: 1
    auto: filer_name_bare
    doc: "(TYPE OR PRINT NAME) under the signature line"

  # ---- page 2 caption --------------------------------------------------
  p2_name:
    map: "FW-001[0].Page2[0].pXCaption[0].PetitionerName1[0]"
    page: 2
    auto: filer_name_bare
  p2_case_number:
    map: "FW-001[0].Page2[0].pXCaption[0].CaseNumber[0]"
    page: 2
    auto: case_number

  # ---- item 8: your gross monthly income -------------------------------
  income_source_1:
    map: "FW-001[0].Page2[0].List8[0].Lia[0].IncomeSource1[0]"
    page: 2
    doc: "Item 8.a(1): source of income"
    default: ""
