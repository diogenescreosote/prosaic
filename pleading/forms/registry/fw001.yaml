form: fw001
title: Request to Waive Court Fees
blank: fw001.pdf
domain: ca/general
revision: 2026-03
technology: overlay          # ADR-0037: draw + flatten; never AcroForm values

agent_guide: >-
  FW-001 Request to Waive Court Fees (Gov. Code §§ 68632-68633, Cal.
  Rules of Court 3.51, 8.26, 8.818). Two pages, and which page-2 items
  are required depends entirely on the ground checked at item 5:

    5a  receiving public benefits  -> page 2 is NOT filled out at all
    5b  household income at or below the limit -> items 8, 9 and 10 only
    5c  cannot pay for necessities AND court fees -> the ENTIRE page 2

  The form says so in terms at the top of page 2, and the commonest
  defect is filling the wrong subset. Set `ground_5a`, `ground_5b` or
  `ground_5c` and fill accordingly.

  **Item 9 is broader than it looks.** It asks for everyone in the home
  "who depend in whole or in part on you for support, **or on whom you
  depend in whole or in part for support**." A filer housed rent-free by
  a friend is within the second clause on its face. Leaving item 9 empty
  in that situation is a position, not an oversight, and needs an
  attachment saying so --- see `overflow_attachment`.

  Money amounts: write them WITHOUT a dollar sign; the form prints its
  own `$`. Item 8b, 9b, the 8b+9b total, and item 11's total are not
  computed here --- pass the arithmetic you intend, and check it.

  This form is filed CONFIDENTIAL. It is not served on the other party
  (Cal. Rules of Court 3.54(a)), so it takes no proof of service.

  The companion FW-003 (Order on Court Fee Waiver) is completed by the
  court, not the filer.

fields:
