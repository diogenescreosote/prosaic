agent_guide: |
  SUBP-002 is the Judicial Council form for a CIVIL SUBPOENA DUCES
  TECUM — commanding a witness (very often a records custodian) to
  appear at a TRIAL OR HEARING and produce documents, ESI, or things,
  with the CCP § 1985(b) supporting declaration built into page 2. It
  is the instrument for getting records before the COURT at a hearing;
  nothing about it is deposition discovery, so the deposition statutes
  (and their discovery-cutoff timing) do not govern it.

  PICK THE RIGHT FORM FIRST:
    - SUBP-001 — appearance at trial/hearing only, no production
    - SUBP-002 — appearance at trial/hearing AND production (this form)
    - SUBP-010 — records only, to a deposition officer (discovery)
    - SUBP-020 — deposition appearance AND production
  If the records should go to a deposition officer for copying and
  inspection before any hearing, that is SUBP-010, not this form.

  WHO ISSUES AND SERVES IT. An attorney of record issues (signs) it;
  a self-represented party has the clerk issue it. Service is personal
  on the witness (CCP § 1987(a)), with witness fees payable on demand
  (Gov. Code § 68093). Page 3 is the proof of service, completed by
  whoever served it, AFTER service.

  USUAL INVOCATION — as a cover sheet on a subpoena source whose body
  is the records demand:

      cover_sheet: subp002

  The caption fills from the standard front matter on all three pages.
  The subpoena-specific values have no caption source and must be
  supplied per form:

      forms:
        subp002:
          witness: >-
            Custodian of Records, Example Bank, N.A., 500 Market Street,
            Example City, CA 90000, (555) 555-0199
          hearing_date: "October 15, 2026"
          hearing_time: "9:00 a.m."
          dept_checkbox: true
          hearing_dept: "20"
          hearing_address: "600 Civic Center Drive, Example City, CA 90000"
          records_by_mail: true
          role_respondent: true
          decl_as_attorney: true
          good_cause: >-
            The records are needed at the hearing to establish the
            completeness and provenance of the account history at
            issue, which cannot be shown by other evidence.
          materiality: >-
            The motion turns on what the account records actually
            contained on the dates in question; the originals and
            their custodian's certification are the only competent
            proof.

  THE ATTACHMENT IS NUMBER 2 ON THIS FORM. The records demand is item
  2 of the page-2 declaration, so an attachment carrying it is
  "Attachment 2" — not "Attachment 3" as on SUBP-010. A source reusing
  a SUBP-010 attachment must retitle it. good_cause and materiality
  overflow to Attachments 3 and 4 respectively.

  COHERENT CHECKBOX COMBINATIONS:
    - Item 3: check EXACTLY ONE of appear_and_produce (personal
      attendance + originals; the § 1560(b) mail-in expressly does not
      comply) or records_by_mail (custodian mails copies + a § 1561
      declaration to the CLERK at the item 1 address and need not
      appear). For business-records custodians, records_by_mail is the
      usual choice; appear_and_produce is for live authentication.
    - Page 2 support: decl_on_form is on by default (the form's own
      items 1-4 are the showing). If a separate affidavit is attached
      instead, set decl_via_affidavit and turn decl_on_form off.
    - Declaration item 1: check exactly one role_* box for the
      declarant's capacity (with the specify field for attorney_for /
      other), and exactly one of decl_as_party / decl_as_attorney at
      the signature.
    - Item 1a: pair each of dept/division/room fill-ins with its
      selector checkbox; fill only what the court actually uses.

  GOOD CAUSE AND MATERIALITY ARE NOT BOILERPLATE. CCP § 1985(b)
  requires the declaration to show good cause for production and the
  items' materiality to the issues, and a subpoena duces tecum stands
  or falls on that showing when challenged (CCP § 1987.1). State
  concrete, case-specific reasons; a conclusory recital invites a
  motion to quash.

  CONSUMER AND EMPLOYEE RECORDS — SAME BIG CAVEAT AS SUBP-010. If the
  records concern a "consumer" (CCP § 1985.3) or "employee" (§ 1985.6)
  — medical, financial, phone, school, personnel records of an
  identifiable person — the subpoenaing party must serve that person
  with a NOTICE TO CONSUMER OR EMPLOYEE (SUBP-025) on the statutory
  clocks before the custodian must comply. SUBP-025 is registered:
  declare the recipients in `consumer_notices:` on the source and the
  build emits one notice per person alongside the subpoena. Medical
  and psychotherapy records may additionally need authorization or a
  court order, and privacy objections are routine.

  ALWAYS LEFT BLANK — do not fill:
    - date_issued and decl_date, and both signature lines (the print
      names ARE pre-filled from the filer; the pen strokes and dates
      remain for the human);
    - every page-3 proof-of-service field and checkbox (pos_*) — the
      server completes them after service, and the copy served on the
      witness carries page 3 blank.
