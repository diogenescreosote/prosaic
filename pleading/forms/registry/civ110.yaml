# CIV-110 — Request for Dismissal (Judicial Council of California)
#
# LiveCycle (XFA) form with dotted hierarchical field names; the map
# below uses the full qualified names, verified empirically against the
# blank (ported from civ110_fill.py, whose FIELD constants carry the
# same verification). The descriptor fills the caption, plus item
# 1.a/1.b (the dismissal-type and pleading-type choice), item 2's
# fee-waiver fact, and the identification/role checkboxes under each
# of the two signature blocks — every one of these only when a human
# has explicitly said which applies, never guessed or defaulted. Every
# date and signature is still left for the parties to complete by hand
# at signing — a CIV-110 for a stipulated dismissal is signed by both
# sides.
#
# The two signature blocks (item 2 and item 3) repeat an identical-
# looking identification pair and role group, and the role group even
# reuses one leaf field name ("RB2Choice2[0/1/2]") across both blocks —
# exactly the kind of thing that has turned out to be a shared/aliased
# widget on other JC forms. Verified empirically 2026-08-18 that these
# are NOT shared here (distinct AcroForm objects and distinct XFA data
# nodes; a same-fill rasterized check showed zero cross-block bleed) —
# see agent_guide's "Verified: item2 vs. item3 independence" for the
# full account before changing how either block is mapped.

form: civ110
title: Request for Dismissal
domain: ca/civil
revision: "2025-01"            # form revision this map was verified against
source_url: https://courts.ca.gov/documents/civ110.pdf
blank: civ110.pdf
technology: xfa                # XFA layer is stripped; flat AcroForm is filled

# Interactive-use chrome stripped from filing copies: privacy banner,
# Save/Print/Clear buttons, and the courts.ca.gov footer link button.
# (XFA leaf widget names carry an "[0]" index suffix.)
chrome_fields: ["Warning[0]", "Print[0]", "Save[0]", "Reset[0]", "CourtLink[0]"]

fields:
  # -- Page 1: attorney/party block ------------------------------------
  # This form has a granular attorney block (separate name / bar-number /
  # firm / street / city / state / zip boxes). Only the name has an auto
  # binding; the rest have no auto equivalent of the legacy filler's
  # filer_address_lines parsing and must be supplied via the per-form
  # block (forms: {civ110: {...}}) when needed.
  attorney_name:
    map: "CIV-110[0].Page1[0].p1Caption[0].AttyPartyInfo[0].Name[0]"
    page: 1
    doc: >-
      NAME box of the attorney/party block. auto=attorney_line1 equals
      filer_name for self-represented filers; when filer_bar_number is
      set the auto appends "(SBN …)", so attorneys should override this
      field via the forms block and put the bar number in
      filer_bar_number instead.
    auto: attorney_line1
  filer_bar_number:
    map: "CIV-110[0].Page1[0].p1Caption[0].AttyPartyInfo[0].AttyBarNo[0]"
    page: 1
    doc: "STATE BAR NUMBER — no auto binding; supply via forms block (blank for self-represented filers)"
    default: ""
  filer_firm:
    map: "CIV-110[0].Page1[0].p1Caption[0].AttyPartyInfo[0].AttyFirm[0]"
    page: 1
    doc: "FIRM NAME — no auto binding; supply via forms block"
    default: ""
  filer_street_address:
    map: "CIV-110[0].Page1[0].p1Caption[0].AttyPartyInfo[0].Street[0]"
    page: 1
    doc: "Filer STREET ADDRESS — no auto binding; supply via forms block"
    default: ""
  filer_city:
    map: "CIV-110[0].Page1[0].p1Caption[0].AttyPartyInfo[0].City[0]"
    page: 1
    doc: "Filer CITY — no auto binding; supply via forms block"
    default: ""
  filer_state:
    map: "CIV-110[0].Page1[0].p1Caption[0].AttyPartyInfo[0].State[0]"
    page: 1
    doc: "Filer STATE (two-letter) — no auto binding; supply via forms block"
    default: ""
  filer_zip:
    map: "CIV-110[0].Page1[0].p1Caption[0].AttyPartyInfo[0].Zip[0]"
    page: 1
    doc: "Filer ZIP CODE — no auto binding; supply via forms block"
    default: ""
  phone:
    map: "CIV-110[0].Page1[0].p1Caption[0].AttyPartyInfo[0].Phone[0]"
    page: 1
    doc: "Telephone number"
    auto: phone
  fax:
    map: "CIV-110[0].Page1[0].p1Caption[0].AttyPartyInfo[0].Fax[0]"
    page: 1
    doc: "Fax number (optional)"
    auto: fax
  email:
    map: "CIV-110[0].Page1[0].p1Caption[0].AttyPartyInfo[0].Email[0]"
    page: 1
    doc: "Email address"
    auto: email
  attorney_for:
    map: "CIV-110[0].Page1[0].p1Caption[0].AttyPartyInfo[0].AttyFor[0]"
    page: 1
    doc: "ATTORNEY FOR (Name) — or the filer's own role if self-represented"
    auto: attorney_for

  # -- Page 1: court block ----------------------------------------------
  court_county:
    map: "CIV-110[0].Page1[0].p1Caption[0].CourtInfo[0].CrtCounty[0]"
    page: 1
    doc: "County name only — the form prints 'SUPERIOR COURT OF CALIFORNIA, COUNTY OF'"
    auto: court_county
  court_street_address:
    map: "CIV-110[0].Page1[0].p1Caption[0].CourtInfo[0].CrtStreet[0]"
    page: 1
    doc: "Court street address"
    auto: court_street_address
  court_mailing_address:
    map: "CIV-110[0].Page1[0].p1Caption[0].CourtInfo[0].CrtMailingAdd[0]"
    page: 1
    doc: "Court mailing address"
    auto: court_mailing_address
  court_city_zip:
    map: "CIV-110[0].Page1[0].p1Caption[0].CourtInfo[0].CrtCityZip[0]"
    page: 1
    doc: "Court city and ZIP"
    auto: court_city_zip
  court_branch:
    map: "CIV-110[0].Page1[0].p1Caption[0].CourtInfo[0].CrtBranch[0]"
    page: 1
    doc: "Court branch name"
    auto: court_branch

  # -- Page 1: caption parties + case number ------------------------------
  plaintiff:
    map: "CIV-110[0].Page1[0].p1Caption[0].TitlePartyName[0].Party1[0]"
    page: 1
    doc: "PLAINTIFF/PETITIONER caption name"
    auto: petitioner
  defendant:
    map: "CIV-110[0].Page1[0].p1Caption[0].TitlePartyName[0].Party2[0]"
    page: 1
    doc: "DEFENDANT/RESPONDENT caption name"
    auto: respondent
  case_number:
    map: "CIV-110[0].Page1[0].p1Caption[0].CaptionSub[0].CaseNumber[0].CaseNumber[0]"
    page: 1
    doc: "Case number"
    auto: case_number

  # -- Page 1, item 1.b: fill-ins paired with the pleading_type_*
  # checkboxes above. Each defaults blank and is only set on explicit
  # human instruction, alongside the checkbox it belongs to.
  cross_complaint_1_date:
    map: "CIV-110[0].Page1[0].List1[0].LI1b[0].li1b[0].li1b3[0].FillText109[1]"
    page: 1
    doc: "Item 1.b(3) 'on (date):' — the first cross-complaint's filing date"
    default: ""
  cross_complaint_1_name:
    map: "CIV-110[0].Page1[0].List1[0].LI1b[0].li1b[0].li1b3[0].FillText109[0]"
    page: 1
    doc: "Item 1.b(3) 'by (name):' — who filed the first cross-complaint"
    default: ""
  cross_complaint_2_date:
    map: "CIV-110[0].Page1[0].List1[0].LI1b[0].li1b[0].li1b4[0].FillText109[0]"
    page: 1
    doc: "Item 1.b(4) 'on (date):' — the second cross-complaint's filing date"
    default: ""
  cross_complaint_2_name:
    map: "CIV-110[0].Page1[0].List1[0].LI1b[0].li1b[0].li1b4[0].FillText109[1]"
    page: 1
    doc: "Item 1.b(4) 'by (name):' — who filed the second cross-complaint"
    default: ""
  pleading_type_other_specify:
    map: "CIV-110[0].Page1[0].List1[0].LI1b[0].li1b[0].li1b6[0].FillText109[0]"
    page: 1
    doc: "Item 1.b(6) '(specify)*:' — free text next to pleading_type_other"
    default: ""

  # -- Page 1: signature blocks (items 2 and 3) — hand-completed ----------
  item2_date:
    map: "CIV-110[0].Page1[0].List2[0].DateTimeField1[0]"
    page: 1
    doc: "Item 2 date — LEAVE BLANK for hand-dating at signature"
    default: ""
  item2_print_name:
    map: "CIV-110[0].Page1[0].List2[0].Sig1Name[0]"
    page: 1
    doc: >-
      Item 2 'type or print name' of the requesting attorney/party —
      LEAVE BLANK by default (completed at signing); may be set via the
      forms block if a typed name is wanted.
    default: ""
  item3_date:
    map: "CIV-110[0].Page1[0].Item3[0].DateTimeField1[0]"
    page: 1
    doc: "Item 3 (consent to dismissal) date — LEAVE BLANK for hand-dating"
    default: ""
  item3_print_name:
    map: "CIV-110[0].Page1[0].Item3[0].YourName_ft[0]"
    page: 1
    doc: >-
      Item 3 'type or print name' of the consenting attorney/party —
      LEAVE BLANK by default (completed at signing); may be set via the
      forms block if a typed name is wanted.
    default: ""

  # -- Page 2: caption echo -----------------------------------------------
  plaintiff_p2:
    map: "CIV-110[0].Page2[0].PxCaption[0].TitlePartyName[0].Party1[0]"
    page: 2
    doc: "Page-2 caption echo of the plaintiff/petitioner"
    auto: petitioner
  defendant_p2:
    map: "CIV-110[0].Page2[0].PxCaption[0].TitlePartyName[0].Party2[0]"
    page: 2
    doc: "Page-2 caption echo of the defendant/respondent"
    auto: respondent
  case_number_p2:
    map: "CIV-110[0].Page2[0].PxCaption[0].CaseNumber[0].CaseNumber[0]"
    page: 2
    doc: "Page-2 caption echo of the case number"
    auto: case_number

checkboxes:
  # -- Item 1.a: what kind of dismissal (mutually exclusive triple; one
  # XFA field name, "RB1Choices[0]", repeated under each option with a
  # different on_value — a true exclGroup radio). This is the fact
  # the filing party is stating, not a personal consent-in-progress
  # (see mc050.yaml's party_role_* for the same distinction), so it is
  # fillable on explicit human instruction, never guessed or defaulted.
  dismissal_with_prejudice:
    map: "CIV-110[0].Page1[0].List1[0].li1a[0].List1[0].li1a1[0].RB1Choices[0]"
    on_value: "/1"
    doc: "Item 1.a(1) — 'With prejudice'"
  dismissal_without_prejudice:
    map: "CIV-110[0].Page1[0].List1[0].li1a[0].List1[0].li1a2[0].RB1Choices[0]"
    on_value: "/2"
    doc: "Item 1.a(2) — 'Without prejudice'"
  dismissal_without_prejudice_664_6:
    map: "CIV-110[0].Page1[0].List1[0].li1a[0].List1[0].li1a3[0].RB1Choices[0]"
    on_value: "/3"
    doc: >-
      Item 1.a(3) — 'Without prejudice and with the court retaining
      jurisdiction (Code of Civil Procedure Section 664.6)'

  # -- Item 1.b: what is being dismissed. The printed form has SIX
  # options, not the four a title alone would suggest, and they are NOT
  # all one radio group at the widget level: (1) Complaint and (2)
  # Petition are each their own field name (RB3Choices1 / RB3Choices2);
  # (3) and (4) are two independent "Cross-complaint filed" checkboxes
  # (on_value "/Yes", not "/1" — verified, not assumed, per
  # docs/forms.md's field-names-lie warning), each with its own
  # on (date)/by (name) pair, because a case can have more than one
  # cross-complaint; (5) Entire action and (6) Other share one field
  # name (RB2Choices) and so ARE a true radio pair. In practice one
  # option is checked (the thing being dismissed), except that a
  # cross-complaint checkbox may accompany another selection when both
  # a pleading and its cross-complaint are dismissed together — see
  # agent_guide.
  pleading_type_complaint:
    map: "CIV-110[0].Page1[0].List1[0].LI1b[0].li1b[0].li1b1[0].RB3Choices1[0]"
    on_value: "/1"
    doc: "Item 1.b(1) — 'Complaint'"
  pleading_type_petition:
    map: "CIV-110[0].Page1[0].List1[0].LI1b[0].li1b[0].li1b2[0].RB3Choices2[0]"
    on_value: "/2"
    doc: "Item 1.b(2) — 'Petition'"
  pleading_type_cross_complaint_1:
    map: "CIV-110[0].Page1[0].List1[0].LI1b[0].li1b[0].li1b3[0].Cross-complaint[0]"
    on_value: "/Yes"
    doc: >-
      Item 1.b(3) — 'Cross-complaint filed on (date): ___ by (name):
      ___' — the first of two cross-complaint slots. Pair with
      cross_complaint_1_date / cross_complaint_1_name.
  pleading_type_cross_complaint_2:
    map: "CIV-110[0].Page1[0].List1[0].LI1b[0].li1b[0].li1b4[0].Cross-complaint[0]"
    on_value: "/Yes"
    doc: >-
      Item 1.b(4) — 'Cross-complaint filed on (date): ___ by (name):
      ___' — the second of two cross-complaint slots, for a case with
      more than one cross-complaint. Pair with cross_complaint_2_date /
      cross_complaint_2_name.
  pleading_type_entire_action:
    map: "CIV-110[0].Page1[0].List1[0].LI1b[0].li1b[0].li1b5[0].RB2Choices[0]"
    on_value: "/1"
    doc: "Item 1.b(5) — 'Entire action of all parties and all causes of action'"
  pleading_type_other:
    map: "CIV-110[0].Page1[0].List1[0].LI1b[0].li1b[0].li1b6[0].RB2Choices[0]"
    on_value: "/2"
    doc: "Item 1.b(6) — 'Other (specify)*:' — pair with pleading_type_other_specify"

  # -- Item 2: the fee-waiver fact. The form's own parenthetical says
  # "This information may be obtained from the clerk" — it is a fact
  # about the case file, not something to infer from anything else in
  # the pleading, so treat it exactly like item 1.a/1.b: fillable only
  # on an explicit human instruction that the clerk was actually asked.
  fee_waiver_did:
    map: "CIV-110[0].Page1[0].List2[0].CheckBox2D[0]"
    on_value: "/1"
    doc: >-
      Item 2 — 'The court [X] did ... waive court fees and costs for a
      party in this case.' Only set when a human has confirmed this
      with the clerk, per the form's own instruction — never inferred
      from case posture. If checked, the fee-recovery declaration on
      page 2 must also be completed (see agent_guide); this descriptor
      does not fill page 2.
  fee_waiver_did_not:
    map: "CIV-110[0].Page1[0].List2[0].CheckBox2D[1]"
    on_value: "/2"
    doc: >-
      Item 2 — 'The court did [X] did not waive court fees and costs
      for a party in this case.' Same fact-check requirement as
      fee_waiver_did.

  # -- Item 2 and item 3 signature blocks: the identification pair
  # ("(TYPE OR PRINT NAME OF [ ] ATTORNEY [ ] PARTY WITHOUT ATTORNEY)")
  # and the role group ("Attorney or party without attorney for:
  # [ ] Plaintiff/Petitioner [ ] Defendant/Respondent
  # [ ] Cross-Complainant") each appear ONCE per signature block, twice
  # on the page total. VERIFIED EMPIRICALLY 2026-08-18 that item2's and
  # item3's copies are genuinely independent AcroForm fields, not one
  # shared widget — see agent_guide's "Verified: item2 vs. item3
  # independence" section for the full account. Short version: despite
  # the ROLE group reusing the identical leaf name "RB2Choice2[0/1/2]"
  # in both blocks (unlike the identification pair, which the form
  # gives distinct names CheckBox2A / CheckBox3A), every check — object
  # number, /Parent object, XFA data-binding node, and a rasterized
  # fill of one block with the other left alone — showed the two
  # blocks do not share state. Mapped normally; no overlay needed.
  # Item 2's identification checkboxes pair with item2_print_name
  # (already mapped, above); item 3's pair with item3_print_name.
  item2_signer_is_attorney:
    map: "CIV-110[0].Page1[0].List2[0].CheckBox2A[0]"
    on_value: "/1"
    doc: "Item 2 signature block — '(TYPE OR PRINT NAME OF [X] ATTORNEY ...)'"
  item2_signer_is_party:
    map: "CIV-110[0].Page1[0].List2[0].CheckBox2A[1]"
    on_value: "/2"
    doc: "Item 2 signature block — '(TYPE OR PRINT NAME OF ... [X] PARTY WITHOUT ATTORNEY)'"
  item2_role_plaintiff_petitioner:
    map: "CIV-110[0].Page1[0].List2[0].RB2Choice2[0]"
    on_value: "/Yes"
    doc: >-
      Item 2 signature block — 'Attorney or party without attorney for
      [X] Plaintiff/Petitioner'. The form prints Plaintiff/Petitioner
      as ONE combined checkbox (not separate Plaintiff and Petitioner
      boxes) — verified against the rasterized blank.
  item2_role_defendant_respondent:
    map: "CIV-110[0].Page1[0].List2[0].RB2Choice2[1]"
    on_value: "/Yes"
    doc: >-
      Item 2 signature block — '... for [X] Defendant/Respondent' —
      also one combined checkbox, same as plaintiff/petitioner.
  item2_role_cross_complainant:
    map: "CIV-110[0].Page1[0].List2[0].RB2Choice2[2]"
    on_value: "/Yes"
    doc: "Item 2 signature block — '... for [X] Cross-Complainant'"
  item3_signer_is_attorney:
    map: "CIV-110[0].Page1[0].Item3[0].CheckBox3A[1]"
    on_value: "/1"
    doc: >-
      Item 3 signature block — '(TYPE OR PRINT NAME OF [X] ATTORNEY
      ...)'. NOTE the on_value/widget-index pairing flips relative to
      item2_signer_is_attorney (CheckBox3A[1], not [0]) — verified by
      filling this exact map and rasterizing; do not assume the [0]/[1]
      order mirrors item 2's.
  item3_signer_is_party:
    map: "CIV-110[0].Page1[0].Item3[0].CheckBox3A[0]"
    on_value: "/2"
    doc: >-
      Item 3 signature block — '(TYPE OR PRINT NAME OF ... [X] PARTY
      WITHOUT ATTORNEY)'. See item3_signer_is_attorney's note on index
      order.
  item3_role_plaintiff_petitioner:
    map: "CIV-110[0].Page1[0].Item3[0].RB2Choice2[0]"
    on_value: "/Yes"
    doc: "Item 3 signature block — 'Attorney or party without attorney for [X] Plaintiff/Petitioner'"
  item3_role_defendant_respondent:
    map: "CIV-110[0].Page1[0].Item3[0].RB2Choice2[1]"
    on_value: "/Yes"
    doc: "Item 3 signature block — '... for [X] Defendant/Respondent'"
  item3_role_cross_complainant:
    map: "CIV-110[0].Page1[0].Item3[0].RB2Choice2[2]"
    on_value: "/Yes"
    doc: "Item 3 signature block — '... for [X] Cross-Complainant'"

# Everything else stays deliberately unmapped: everything the clerk
# completes (items 4-7) and the whole page-2 fee-recovery declaration.
# Those represent the clerk's own action or a further fact tied to a
# fee waiver already flagged for human review (fee_waiver_did), never
# a fact the filing party states going in, and the clerk/parties
# complete them by hand, like the dates and signatures.

agent_guide: |
  CIV-110 is the Request for Dismissal used in California civil
  practice. prosaic's usual pattern: a stipulated dismissal — the
  CIV-110 is prepended as a cover to a Stipulation for Dismissal (and
  any [Proposed] Order), with item 1.a/1.b checked, both sides' dates
  and signatures added BY HAND at signing. Invoke via
  `cover_sheet: civ110` in a pleading source's front matter, or fill
  directly.

  The standard caption front matter (filer_*, court_*, petitioner,
  respondent, case_number) resolves the caption automatically on both
  pages. This form's attorney block is granular; the pieces with no
  auto binding are supplied per form:

      forms:
        civ110:
          filer_street_address: "123 Main St"
          filer_city: "Springfield"
          filer_state: "CA"
          filer_zip: "90000"
          # attorneys also set:
          filer_bar_number: "123456"
          filer_firm: "Firm LLP"
          attorney_name: "Sally Sattler"   # override the (SBN …) auto

  Item 1.a/1.b ARE fillable, but only on an explicit human instruction
  about which option applies — never guessed, inferred, or defaulted
  by the tool. This is the same line MC-050 draws around its item-3
  role checkboxes: a fact/decision the filing party states belongs in
  the descriptor; a personal act in progress (a signature, a consent)
  does not. Set the one dismissal-type box (item 1.a) and the one (or,
  for a case with more than one cross-complaint, more than one)
  pleading-type box (item 1.b) the human named:

      forms:
        civ110:
          dismissal_with_prejudice: true       # or _without_prejudice /
                                                # _without_prejudice_664_6
          pleading_type_entire_action: true    # or _complaint / _petition /
                                                # _cross_complaint_1 (+ _2) /
                                                # _other (+ pleading_type_other_specify)
          # cross_complaint_1_date / cross_complaint_1_name (and the
          # _2 pair) accompany a checked pleading_type_cross_complaint_N

  Item 1.b has six printed options, not four: (1) Complaint,
  (2) Petition, (3)/(4) two independent "Cross-complaint filed on
  (date): ___ by (name): ___" slots (a case can have more than one
  cross-complaint), (5) Entire action, (6) Other (specify). In the
  ordinary one-thing-being-dismissed case, exactly one item 1.a box
  and one item 1.b box are checked; a cross-complaint slot may
  additionally be checked alongside another item 1.b box when both a
  pleading and its cross-complaint are being dismissed together —
  never set one without the human having said so.

  ALWAYS left blank for hand completion, still: dates, signatures,
  printed names (item2_/item3_* fields default to blank but accept a
  typed name via the forms block), items 4-7 (clerk's use only), and
  all of page 2 except the fee-waiver's own follow-through (court-fee
  declaration). Do not fill them — those represent the clerk's own
  action, never a fact the filing party states.

  Item 2's fee-waiver fact (`fee_waiver_did` / `fee_waiver_did_not`)
  and the identification/role checkboxes under EACH signature block
  ARE now fillable, on the same "explicit human instruction only"
  basis as item 1.a/1.b — see "Verified: item2 vs. item3 independence"
  below for why this is safe. The fee waiver in particular is a fact
  about the case file the form's own parenthetical says to get from
  the clerk ("This information may be obtained from the clerk.") —
  never infer it from the parties' apparent means, and never set it
  without a human confirming they actually asked. If fee_waiver_did is
  set, the page-2 fee-recovery declaration must also be completed by a
  human; this descriptor has no page-2 wiring for it.

  Each signature block has its own identification pair (attorney vs.
  party without attorney) and role group (Plaintiff/Petitioner /
  Defendant/Respondent / Cross-Complainant, each ONE combined checkbox
  per role, not split further):

      forms:
        civ110:
          fee_waiver_did_not: true             # or fee_waiver_did
          item2_signer_is_party: true           # or item2_signer_is_attorney
          item2_role_plaintiff_petitioner: true # or _defendant_respondent /
                                                 # _cross_complainant
          # item3_* mirror the same three names for the SECOND block —
          # completely independent of item2_*; set only the block(s) a
          # human actually asked for.

  Verified: item2 vs. item3 independence (the reported collision that
  drove this section). A prior report claimed that checking the
  Plaintiff/Petitioner role box for item 2's signature block also
  showed item 3's identical-looking box checked in Acrobat — exactly
  the kind of AcroForm/XFA field-reuse bug this project's descriptor
  process exists to catch (docs/forms.md's "Field names lie" /
  "Silent form revisions" rows). It was NOT waved off: verified
  2026-08-18 by (1) walking the raw PDF object graph — item2's and
  item3's identification and role checkboxes are twelve distinct
  indirect objects with distinct /Parent objects (List2[0]'s parent
  vs. Item3[0]'s parent are different dictionaries), so nothing is
  shared at the AcroForm level; (2) inspecting the blank's XFA
  `datasets` packet — item 2's role group binds under a `<List2>` data
  node and item 3's under a separate `<Item3>` data node, each holding
  its own three `<RB2Choice2>` children, so the XFA data DOM does not
  merge them either; and (3) filling item2_role_defendant_respondent +
  item2_signer_is_party + fee_waiver_did_not on ONE fill alongside
  item3_signer_is_attorney + item3_role_cross_complainant on the SAME
