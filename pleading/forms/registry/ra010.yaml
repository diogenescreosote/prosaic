agent_guide: |
  RA-010 is the MANDATORY notice that a party, attorney or witness
  intends to appear remotely in a civil case (CCP § 367.75; Cal. Rules
  of Court, rule 3.672), unless the court's website describes an online
  procedure for giving notice instead. Check the court's website first.
  Not for juvenile dependency proceedings.

  DEADLINES (rule 3.672(g)-(h); the form's page 3 summarizes them as
  of 2022 --- the rule was amended effective August 4, 2023, so read
  the current rule, not page 3):
    - Proceeding without testimony, noticed 3+ court days out: at least
      2 court days before. Shorter notice: with the moving papers (the
      moving party), or by 2 p.m. the court day before (anyone else).
    - EVIDENTIARY HEARING OR TRIAL noticed 15+ court days out (and
      every small claims trial): file RA-010 and give notice at least
      10 COURT DAYS before (rule 3.672(h)(2)(C)).
    - Evidentiary hearing or trial on less than 15 court days' notice:
      as for a short-notice proceeding above, or file RA-010 and give
      notice received at least 5 court days before (rule
      3.672(h)(2)(D)).
  For an evidentiary hearing or trial this notice IS the motion for a
  remote appearance under CCP § 367.75(d) (rule 3.672(h)(2)(B)). An
  opposing party objects on RA-015, served and filed at least 5 court
  days before (15+ days' notice) or by noon the court day before
  (shorter notice) (rule 3.672(h)(3)). The court may still require
  anyone to appear in person, and the court decides; RA-020 is the
  optional order form.

  ITEM 1 --- who appears remotely: check each that applies and name
  them. A NONPARTY WITNESS who will testify remotely goes under "Other
  (name and role in case)" (appearing_other + appearing_other_name_role;
  more names in appearing_other_continued).
  ITEM 2 --- check ONE: scope_throughout_case (file once) or
  scope_proceeding plus proceeding_type/date/time/dept/
  judicial_officer.
  ITEM 3 --- method_videoconference and/or method_audio_only, per what
  the court's website allows in that department.
  ITEM 4 --- evidentiary hearing or trial only: remote_aspects_requested
  + remote_aspects (what else should happen remotely, and why). Long
  text spills to an MC-025 "Attachment 4" automatically.
  ITEM 5 --- confidentiality_agreement, the signer's own undertaking.

      forms:
        ra010:
          appearing_other: true
          appearing_other_name_role: "Mavis Example, nonparty witness"
          scope_proceeding: true
          proceeding_type: "Evidentiary hearing on motion for protective order re discovery"
          proceeding_date: "November 18, 2026"
          proceeding_time: "9:00 a.m."
          proceeding_dept: "12"
          method_videoconference: true
          remote_aspects_requested: true
          remote_aspects: >-
            Testimony of nonparty witness Mavis Example by
            videoconference; she resides out of state.

  DECLARATION OF NOTICE (page 2): notice must reach every party and
  person entitled to notice; prove it either by a proof of service
  (POS-040, or POS-050 for electronic service) or by completing this
  grid. One block per person: check the role box, then a. name, b. date
  of notice, c. method (Mail / Overnight delivery / Electronic notice /
  Phone / In person), d. the address or phone number used. Blocks 2, 4
  and 6 are "Attorney for:" (say whom in noticeN_attorney_for); 5, 7, 8
  are "Other (specify)". Block 8 is the bottom-right one, which the
  face misnumbers "7.". More people: more_people_attachment and a
  separate MC-025 titled "Attachment Notice".

  The caption fills from standard front matter on both pages (the
  page-2 caption is PLAINTIFF / DEFENDANT / CASE NUMBER only). The
  print-name lines pre-fill from the filer. ALWAYS left blank: both
  dates beside the signatures and both signatures (e-sign fields for
  `sc docuseal send`). Page 3 is instructions and is dropped from the
  fill (`filed_pages`); pass `--pages 1-3` to keep it for reference.
