  notice8_name:
    map: "RA-010[0].Page2[0].NoticetoOtherParties[0].List8[0].Lia[0].T162[0]"
    page: 2
    doc: "Block 8 a. Name"
    default: ""
    size_group: notice
  notice8_date:
    map: "RA-010[0].Page2[0].NoticetoOtherParties[0].List8[0].Lib[0].T163[0]"
    page: 2
    doc: "Block 8 b. Date of notice"
    default: ""
    size_group: notice
  notice8_method:
    map: "RA-010[0].Page2[0].NoticetoOtherParties[0].List8[0].Lic[0].T164[0]"
    page: 2
    doc: "Block 8 c. Method of notice"
    default: ""
    size_group: notice
  notice8_address:
    map: "RA-010[0].Page2[0].NoticetoOtherParties[0].List8[0].Lid[0].T165[0]"
    page: 2
    doc: "Block 8 d. Address or phone number"
    default: ""
