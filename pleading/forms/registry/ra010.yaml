    doc: "Block 7 d. Address or phone number"
    default: ""
    size_group: notice_address
  # Block 8 (right; the face misnumbers it "7."): Other (specify)
  notice8_other_specify:
    map: "RA-010[0].Page2[0].NoticetoOtherParties[0].List8[0].Field5[0]"
