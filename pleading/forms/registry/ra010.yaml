    map: "RA-010[0].Page1[0].List1[0].item1[0].CheckBox2[0]"
    on_value: "/1"
    doc: "Item 1 --- Attorney for Plaintiff/Petitioner will appear remotely"
  appearing_defendant:
    map: "RA-010[0].Page1[0].List1[0].item1[0].CheckBox3[0]"
    on_value: "/1"
    doc: "Item 1 --- Defendant/Respondent will appear remotely"
  appearing_defendant_attorney:
    map: "RA-010[0].Page1[0].List1[0].item1[0].CheckBox4[0]"
    on_value: "/1"
    doc: "Item 1 --- Attorney for Defendant/Respondent will appear remotely"
  appearing_other:
