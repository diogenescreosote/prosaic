agent_guide: |
  SUBP-025 is the mandatory Judicial Council form for the NOTICE TO
  CONSUMER OR EMPLOYEE AND OBJECTION — the notice that CCP §§ 1985.3 and
  1985.6 require a subpoenaing party to serve on the individual whose
  records a subpoena reaches. It is a companion document, never a
  standalone one: it travels with a copy of the subpoena.

  WHEN IT IS REQUIRED. Whenever a subpoena (SUBP-010, SUBP-020, or a
  civil subpoena duces tecum) seeks records of an identifiable
  individual held by someone else:
    - § 1985.3 "consumer" records — a natural person's (or their
      guardian's) medical, dental, psychotherapy, insurance, banking,
      credit-card, phone/utility, school, or professional-service
      records held by a "witness" such as a bank, hospital, therapist,
      carrier, school, or licensed professional;
    - § 1985.6 "employment" records — personnel and employment records
      of an employee held by their employer.
  A records subpoena for such records is INVALID without this notice:
  the custodian may not lawfully produce, and the production is subject
  to being quashed and to sanctions. If in doubt whether the records
  are consumer records, serve the notice — it costs a mailing.

  WHO GETS SERVED, AND WHEN. Serve the notice, with a copy of the
  subpoena, on the consumer or employee (and on that person's attorney
  of record, if they have one in this action) — personally or by mail —
  at least 10 days before the date of production stated in the
  subpoena, and at least 5 days before the subpoena is served on the
  custodian, plus the extension Code Civ. Proc. § 1013 adds for mail.
  Then serve the custodian with the subpoena AND proof that the notice
  was served (§ 1985.3(c)); without that proof the custodian must not
  produce. Every other party must also be served with the subpoena.
  Working backward from the production date is the only safe order of
  operations: the 20/15-day floor on the subpoena and the 10/5-day
  floors on this notice interlock.

  WHAT THE CONSUMER CAN DO — the bottom half of page 1 is theirs. A
  non-party consumer objects by serving a written objection on the
  requesting party and the witness BEFORE the production date (the
  objection is NOT filed with the court); a consumer who IS a party
  must instead move to quash under § 1987.1 and give notice of the
  motion to the witness and the deposition officer at least five days
  before the production date. Nothing in the objection block or in the
  second proof of service on page 2 is ever filled by the subpoenaing
  side — it is a reply form the recipient completes.

  USUAL INVOCATION — declare the notices on the subpoena source and let
  the build emit one filled SUBP-025 per recipient alongside it:

      cover_sheet: subp010
      forms:
        subp010:
          deponent: "Custodian of Records, Example Bank, N.A., …"
          production_date: "September 15, 2026"
        subp025:                       # shared across every notice
          requesting_party: "JANE ROE, Respondent"
          production_date: "September 15, 2026"
          witness: >-
            Custodian of Records, Example Bank, N.A., 500 Market
            Street, Example City, CA 90000
      consumer_notices:
        - consumer: "JOHN SMITH"
        - consumer: "MARY MAJOR"
          slug: mary_major
          witness: "Custodian of Records, Example Employer, Inc., …"

  Each list entry names one recipient and may override any SUBP-025
  field or checkbox for that recipient; everything else comes from the
  shared ``forms.subp025`` block and the standard caption front matter
  (filer_*, court_*, petitioner, respondent, case_number). Outputs land
  next to the subpoena PDF as
  ``<source stem>.subp025.<slug>.pdf``. The schema is specified in
  pleading/pleading_markdown_spec.md.

  FILLING IT DIRECTLY (``sc form fill subp025``) needs only four
  values: consumer, requesting_party, production_date, witness. The
  production_date MUST equal the production date on the subpoena's face
  — a mismatch misstates the consumer's deadline and invites a motion.

  ALWAYS LEFT BLANK — do not fill:
    - notice_date and the notice signature (the signature line has no
      widget; notice_signer IS pre-filled, so only the pen strokes, the
      date, and the REQUESTING PARTY / ATTORNEY capacity box remain);
    - the entire objection block (objection_*) and its checkboxes —
      that half of page 1 belongs to the recipient;
    - every page-2 proof-of-service field and checkbox (pos_*). They
      are mapped so post-service workflows can complete them from real
      service facts, but at issuance nothing has been served, and the
      copy served on the consumer carries page 2 blank.
