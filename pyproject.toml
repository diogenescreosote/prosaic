[project]
name = "prosaic"
version = "0.1.0"
description = "Deterministic document assembly and deadline computation for self-represented civil litigants."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andrew Cone", email = "andrew@tractarian.org" }]
# The name "prosaic" is taken on PyPI by an unrelated project. This package
# installs from source only; the unknown classifier makes PyPI reject an
# accidental upload.
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "pypdf>=4.2",
    "reportlab>=4.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prosaic"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import order
    "UP",        # modernize
    "B",         # bugbear
    "SIM",       # simplify
    "C4",        # comprehensions
    "ARG",       # unused arguments
    "PTH",       # pathlib over os.path
    "RET",       # return consistency
    "RUF",
]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
