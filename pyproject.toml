[project]
name = "prosaic"
version = "0.1.0"
description = "Deterministic document assembly and deadline computation for self-represented civil litigants."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andrew Cone", email = "andrewpcone@gmail.com" }]
# The name "prosaic" is taken on PyPI by an unrelated project. This package
# installs from source only; the unknown classifier makes PyPI reject an
# accidental upload.
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "pypdf[crypto]>=4.2",
    "reportlab>=4.1",
    "anthropic>=0.121.0",
    "pyyaml>=6.0.3",
    "python-docx>=1.2.0",
    "pillow>=12.3.0",
    "pymupdf>=1.28.2",
]

[project.scripts]
prosaic = "prosaic.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-reportlab>=4.5.1.20260807",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prosaic"]

[tool.ruff]
line-length = 100
target-version = "py312"
# The operational trees (pleading/, connectors/, sync/, cli/, templates/)
# are ported from this project's private predecessor and keep its style so
# upstream fixes keep merging as clean diffs; they are exercised by their
# own test suite rather than by these linters. The same holds for the tests
# that came over with them: the scenario suite, its harness, and the
# repository-invariant checks. Everything native to prosaic — the package
# and tests/test_*.py written here — is linted normally.
extend-exclude = [
    "pleading",
    "connectors",
    "sync",
    "cli",
    "templates",
    "specs",
    "design",
    "tests/harness",
    "tests/scenarios",
    "tests/test_docs_coverage.py",
    "tests/test_platform_seams.py",
    "tests/test_repo_hygiene.py",
    "tests/test_system_dependencies.py",
]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import order
    "UP",        # modernize
    "B",         # bugbear
    "SIM",       # simplify
    "C4",        # comprehensions
    "ARG",       # unused arguments
    "PTH",       # pathlib over os.path
    "RET",       # return consistency
    "RUF",
]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
# Same boundary as the ruff excludes above: the ported trees keep upstream
# style so upstream fixes merge cleanly. Exclusions apply because CI passes
# `tests` as a directory, not as a list of files.
exclude = ["^tests/(harness|scenarios)/", "^tests/test_(docs_coverage|platform_seams|repo_hygiene|system_dependencies)\\.py$"]

[tool.pytest.ini_options]
testpaths = ["tests", "pleading/tests"]
addopts = "-q --cov=prosaic --cov-report=term-missing"
markers = ["ai: judged by a headless LLM; skipped when unavailable"]

[tool.coverage.report]
fail_under = 95
show_missing = true
