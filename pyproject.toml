[project]
name = "prosaic"
version = "0.1.0"
description = "Deterministic document assembly for self-represented civil litigants."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andrew Cone", email = "andrewpcone@gmail.com" }]
# The name "prosaic" is taken on PyPI by an unrelated project. This package
# installs from source only; the unknown classifier makes PyPI reject an
# accidental upload.
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "pypdf[crypto]>=4.2",
    "reportlab>=4.1",
    "pyyaml>=6.0.3",
    "python-docx>=1.2.0",
    "pillow>=12.3.0",
    "pymupdf>=1.28.2",
    "opentimestamps-client>=0.7.2",
    "docuseal>=1.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-reportlab>=4.5.1.20260807",
    "types-pyyaml>=6.0.12",
    "zxing-cpp>=3.1.1",
]

# Nothing here is an importable package: the entry point is the `sc` shell
# CLI and the scripts under pleading/, run by path. uv installs the
# dependencies and nothing is built.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
# The operational trees (pleading/, connectors/, sync/, cli/, templates/)
# are ported from this project's private predecessor and keep its style so
# upstream fixes keep merging as clean diffs; they are exercised by their
# own test suite rather than by these linters. The same holds for the tests
# that came over with them: the scenario suite, its harness, and the
# repository-invariant checks. What remains linted is the handful of
# tests written here directly.
extend-exclude = [
    "pleading",
    "connectors",
    "sync",
    "cli",
    "templates",
    "specs",
    "design",
    "tests/harness",
    "tests/scenarios",
    "tests/test_docs_coverage.py",
    "tests/test_platform_seams.py",
    "tests/test_repo_hygiene.py",
    "tests/test_system_dependencies.py",
]

[tool.ruff.lint.per-file-ignores]
# Test files favor dense fixture setup: semicolon one-liners and long
# literal lines read better than reflowed fixtures, and pytest requests
# fixtures by name for their side effects, so an "unused" argument is
# the mechanism working as designed, not an oversight.
"**/test_*.py" = ["E501", "E702", "ARG"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import order
    "UP",        # modernize
    "B",         # bugbear
    "SIM",       # simplify
    "C4",        # comprehensions
    "ARG",       # unused arguments
    "PTH",       # pathlib over os.path
    "RET",       # return consistency
    "RUF",
]

[tool.mypy]
strict = true
python_version = "3.12"
# One deliberate loosening: the tests call into the ported trees, which
# are deliberately untyped (the same boundary as the ruff excludes), so
# no-untyped-call is off. The tests themselves are fully annotated ---
# no-untyped-def stays on.
disallow_untyped_calls = false
# Same boundary as the ruff excludes above: the ported trees keep upstream
# style so upstream fixes merge cleanly. Exclusions apply because CI passes
# `tests` as a directory, not as a list of files.
exclude = ["^tests/(harness|scenarios)/", "^tests/test_(docs_coverage|platform_seams|repo_hygiene|system_dependencies)\\.py$"]

[[tool.mypy.overrides]]
# Imported by tests through sys.path insertions into the ported
# pleading/ tree; mypy cannot resolve them as packages and must not
# try. Native triage modules are NOT listed: they resolve normally
# and are held to the same bar as the tests.
module = ["form_fill", "jc_common", "md_pleading"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests", "pleading/tests", "signing/tests"]
addopts = "-q"
markers = ["ai: judged by a headless LLM; skipped when unavailable"]
